
services:
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "src/main.py"]
    volumes:
      - ./raw:/app/raw
      - ./clean:/app/clean
      - ./rejected:/app/rejected
      - ./logs:/app/logs

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_DB: pulseiq_dw
      POSTGRES_USER: pulseiq
      POSTGRES_PASSWORD: pulseiq_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseiq -d pulseiq_dw"]
      interval: 5s
      timeout: 5s
      retries: 10

  superset-init:
    build:
      context: .
      dockerfile: Dockerfile.superset
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "pulseiq_local_dev_secret_change_before_production_2026"
    volumes:
      - superset_home:/app/superset_home
    command:
      - /bin/bash
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin \
          --username admin \
          --firstname PulseIQ \
          --lastname Admin \
          --email admin@example.com \
          --password 'PulseIQ_Admin_2026!' || true) &&
        superset init

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
      warehouse:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "pulseiq_local_dev_secret_change_before_production_2026"
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    command:
      - /bin/bash
      - -c
      - |
        /usr/bin/run-server.sh

volumes:
  pgdata:
  superset_home:
